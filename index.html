<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CONNECT MONTHLY RANKING</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#111;color:#fff}
.app{max-width:520px;margin:auto;min-height:100vh;background:#181818}
header{padding:18px 18px 14px;text-align:center;border-bottom:1px solid #333;position:sticky;top:0;background:#181818;z-index:5}
.logo-wrap{display:flex;justify-content:center;align-items:center;margin:0 auto 8px;width:150px;height:58px;overflow:hidden}
.logo-wrap img{width:150px;height:auto;display:block} header h1{font-size:20px;margin:0 0 5px;letter-spacing:1px}.month{color:#aaa;font-size:13px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;background:#222;position:sticky;top:102px;z-index:4}
nav button{border:0;border-radius:10px;padding:10px 4px;background:#333;color:#bbb;font-weight:700;font-size:12px}
nav button.active{background:#fff;color:#111}
main{padding:16px}.screen{display:none}.screen.active{display:block}
.card{background:#242424;border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:4px 0 14px}.hint{color:#999;font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid #333}.row:last-child{border-bottom:0}
.rank{width:36px;font-weight:800}.name{flex:1;font-weight:700}.rt{color:#888;font-size:12px;margin-left:7px}.pts{font-size:18px;font-weight:800}
label{display:block;font-size:12px;color:#aaa;margin:12px 0 6px}
select,input{width:100%;padding:13px;border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.resultbtn{padding:14px;border:1px solid #444;background:#111;color:#fff;border-radius:10px;font-weight:700}
.resultbtn.selected{background:#fff;color:#111;border-color:#fff}
button.primary{width:100%;padding:15px;border:0;border-radius:11px;background:#fff;color:#111;font-weight:800;font-size:16px;margin-top:14px}
.warning{color:#ffb3b3;background:#321f1f;padding:10px;border-radius:9px;font-size:12px;margin-top:10px}
.success{color:#c9ffd4;background:#1d3022;padding:10px;border-radius:9px;font-size:13px;margin-top:10px}
.empty{text-align:center;color:#777;padding:30px 10px}.small{font-size:11px;color:#777;margin-top:8px}
</style>
</head>

<button class="active" data-screen="ranking">現在のランキング</button>

<main>
<section id="ranking" class="screen active">
<div class="card"><h2>🏆 現在のランキング</h2><div id="rankingList"></div></div>
<div class="card"><h2>参加者登録</h2>
<div class="hint">ニックネームと過去最高レーティングを登録。レーティングは表示のみ。</div>
<label>ニックネーム</label><input id="newName" maxlength="20" placeholder="例：ともき">
<label>過去最高レーティング</label><input id="newRt" type="number" step="0.1" min="0" max="20" placeholder="例：8.2">
<button class="primary" id="registerBtn">登録する</button>
<div id="regMsg"></div></div>
</section>
<section id="match" class="screen">
<div class="card"><h2>🎯 対戦結果入力</h2>
<div class="hint">同じ組み合わせは今月1回まで。</div>
<label>プレイヤーA</label><select id="pA"></select>
<label>プレイヤーB</label><select id="pB"></select>
<div id="matchArea"></div>
</div>
</section>
<section id="last" class="screen">
<div class="card"><h2>🏆 先月のランキング</h2><div id="lastList"></div></div>
</section>
</main></div>
<script>
const SUPABASE_URL = "https://wcmxifczhmzsqhmvcukp.supabase.co";
const SUPABASE_KEY = "sb_publishable_zIssqVYp7Wg93lGSqLFhnw_fLC_kYKZ";
const API = SUPABASE_URL + '/rest/v1';
const headers = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};
let state = {players:[], matches:[]};
let sel = {};

const monthKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const prevMonthKey=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return monthKey(d)};
const monthLabel=k=>{const [y,m]=k.split('-');return `${y}年${Number(m)}月`};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const playerById=id=>state.players.find(p=>String(p.id)===String(id));
const playerName=id=>playerById(id)?.nickname||'';

async function api(path, options={}){
  const res=await fetch(API+path,{...options,headers:{...headers,...(options.headers||{})},cache:'no-store'});
  if(!res.ok){
    let body=''; try{body=await res.text()}catch(e){}
    const err=new Error(body||('HTTP '+res.status)); err.status=res.status; throw err;
  }
  const text=await res.text();
  return text?JSON.parse(text):null;
}

async function loadData(showError=true){
  try{
    const [players,matches]=await Promise.all([
      api('/players?select=id,nickname,best_rating,created_at&order=created_at.asc'),
      api('/matches?select=*&order=created_at.asc')
    ]);
    state.players=players||[]; state.matches=matches||[];
    render();
  }catch(e){
    if(showError) alert('データの読み込みに失敗しました。通信環境を確認して、もう一度開き直してね。');
    console.error(e);
  }
}

function standings(k, onlyPlayed=false){
  const ms=state.matches.filter(x=>x.month_key===k);
  const played=new Set(ms.flatMap(x=>[String(x.player_a),String(x.player_b)]));
  const map=new Map(state.players.map(p=>[String(p.id),{...p,points:0,matches:0}]));
  ms.forEach(m=>{
    const w=map.get(String(m.winner)), l=map.get(String(m.loser));
    if(w){w.points+=Number(m.winner_points);w.matches++}
    if(l){l.points+=Number(m.loser_points);l.matches++}
  });
  return [...map.values()]
    .filter(p=>!onlyPlayed || played.has(String(p.id)))
    .sort((a,b)=>b.points-a.points||b.matches-a.matches||a.nickname.localeCompare(b.nickname,'ja'));
}

function rankRows(arr){
  return arr.map((p,i)=>`<div class="row"><div class="rank">${i+1}</div><div class="name">${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${esc(p.nickname)} <span class="rt">最高Rt.${esc(p.best_rating)}</span><div class="small">${p.matches}戦</div></div><div class="pts">${p.points}pt</div></div>`).join('');
}

function render(){
  const cur=monthKey();
  document.getElementById('monthLabel').textContent=monthLabel(cur);
  const current=standings(cur,false);
  document.getElementById('rankingList').innerHTML=current.length?rankRows(current):'<div class="empty">まだ参加者がいないよ</div>';

  const prev=prevMonthKey();
  const last=standings(prev,true);
  document.getElementById('lastList').innerHTML=last.length
    ? `<div class="hint" style="margin-bottom:8px">${monthLabel(prev)} ／ 🥇1位特典：翌月1ヶ月投げ放題無料</div>`+rankRows(last)
    : '<div class="empty">先月のランキングデータはまだありません。</div>';

  const a=document.getElementById('pA'), b=document.getElementById('pB');
  const oldA=a.value, oldB=b.value;
  const opts='<option value="">選択してください</option>'+state.players.map(p=>`<option value="${p.id}">${esc(p.nickname)} (最高Rt.${esc(p.best_rating)})</option>`).join('');
  a.innerHTML=opts;b.innerHTML=opts;
  if(state.players.some(p=>String(p.id)===oldA)) a.value=oldA;
  if(state.players.some(p=>String(p.id)===oldB)) b.value=oldB;
  renderMatch();
}

function alreadyPlayed(a,b){
  return state.matches.some(x=>x.month_key===monthKey() && ((String(x.player_a)===String(a)&&String(x.player_b)===String(b))||(String(x.player_a)===String(b)&&String(x.player_b)===String(a))));
}

function renderMatch(){
  const area=document.getElementById('matchArea'), a=document.getElementById('pA').value, b=document.getElementById('pB').value;
  sel={};
  if(!a||!b||a===b){area.innerHTML='<div class="small">2人を選ぶと結果を入力できます。</div>';return}
  if(alreadyPlayed(a,b)){area.innerHTML='<div class="warning">この2人は今月すでに対戦済み。</div>';return}
  area.innerHTML=`
    <label>701の勝者</label><div class="grid"><button class="resultbtn" data-leg="1" data-win="${a}">${esc(playerName(a))}</button><button class="resultbtn" data-leg="1" data-win="${b}">${esc(playerName(b))}</button></div>
    <div id="cricketWrap" style="display:none"><label>クリケットの勝者</label><div class="grid"><button class="resultbtn" data-leg="2" data-win="${a}">${esc(playerName(a))}</button><button class="resultbtn" data-leg="2" data-win="${b}">${esc(playerName(b))}</button></div></div>
    <div id="choiceWrap" style="display:none"><label>チョイスの勝者</label><div class="grid"><button class="resultbtn" data-leg="3" data-win="${a}">${esc(playerName(a))}</button><button class="resultbtn" data-leg="3" data-win="${b}">${esc(playerName(b))}</button></div></div>
    <div id="confirm"></div>`;
  area.querySelectorAll('.resultbtn').forEach(btn=>btn.addEventListener('click',()=>pick(btn)));
}

function pick(btn){
  const leg=Number(btn.dataset.leg); sel[leg]=btn.dataset.win;
  document.querySelectorAll(`[data-leg="${leg}"]`).forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');
  if(leg===1) document.getElementById('cricketWrap').style.display='block';
  if(leg===2){
    if(sel[1]===sel[2]) finishPreview(2);
    else document.getElementById('choiceWrap').style.display='block';
  }
  if(leg===3) finishPreview(3);
}

function finishPreview(legs){
  const a=document.getElementById('pA').value,b=document.getElementById('pB').value;
  const winner=sel[legs],loser=winner===a?b:a,pts=legs===2?2:1;
  document.getElementById('confirm').innerHTML=`<div class="success">${legs===2?'スト勝ち（2-0）':'2-1'}：<b>${esc(playerName(winner))} +${pts}pt</b> ／ ${esc(playerName(loser))} -${pts}pt</div><button class="primary" id="saveMatchBtn">この結果を登録</button>`;
  document.getElementById('saveMatchBtn').addEventListener('click',()=>saveMatch(a,b,winner,loser,pts,legs));
}

async function saveMatch(a,b,winner,loser,pts,legs){
  const btn=document.getElementById('saveMatchBtn'); if(btn){btn.disabled=true;btn.textContent='登録中…'}
  try{
    // loadData() は renderMatch() を呼び sel を初期化するため、
    // 対戦結果を先に退避してから最新データを読み込む
    const result701=Number(sel[1]);
    const resultCricket=Number(sel[2]);
    const resultChoice=legs===3?Number(sel[3]):null;

    await loadData(false);
    if(alreadyPlayed(a,b)){alert('この2人は今月すでに対戦済みです。');renderMatch();return}
    const payload={
      month_key:monthKey(), player_a:Number(a), player_b:Number(b),
      leg_701_winner:result701, cricket_winner:resultCricket,
      choice_winner:resultChoice,
      winner:Number(winner), loser:Number(loser), winner_points:pts, loser_points:-pts
    };
    await api('/matches',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(payload)});
    document.getElementById('pA').value='';document.getElementById('pB').value='';
    await loadData(false);
    alert('対戦結果を登録しました！');
  }catch(e){
    console.error(e);
    if(String(e.message).includes('matches_unique_month_pair')||String(e.message).includes('duplicate key')) alert('この2人は今月すでに対戦済みです。');
    else alert('対戦結果を登録できませんでした。もう一度試してね。');
  }finally{if(btn){btn.disabled=false;btn.textContent='この結果を登録'}}
}

async function addPlayer(){
  const nameEl=document.getElementById('newName'),rtEl=document.getElementById('newRt'),msg=document.getElementById('regMsg'),btn=document.getElementById('registerBtn');
  const name=(nameEl.value||'').trim(),rt=(rtEl.value||'').trim();
  if(!name||!rt){msg.innerHTML='<div class="warning">ニックネームと過去最高レーティングを入力してね。</div>';return}
  const rtNum=Number(rt);
  if(!Number.isFinite(rtNum)||rtNum<0||rtNum>20){msg.innerHTML='<div class="warning">レーティングは0〜20の数字で入力してね。</div>';return}
  btn.disabled=true;btn.textContent='登録中…';
  try{
    await loadData(false);
    if(state.players.length>=20){msg.innerHTML='<div class="warning">参加者は最大20人まで。</div>';return}
    if(state.players.some(p=>p.nickname.trim().toLowerCase()===name.toLowerCase())){msg.innerHTML='<div class="warning">同じニックネームがあるよ。</div>';return}
    await api('/players',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({nickname:name,best_rating:rtNum})});
    nameEl.value='';rtEl.value='';msg.innerHTML='<div class="success">登録完了！全員のランキングに反映したよ。</div>';
    await loadData(false);
  }catch(e){
    console.error(e);
    if(String(e.message).includes('duplicate key')) msg.innerHTML='<div class="warning">同じニックネームがあるよ。</div>';
    else msg.innerHTML='<div class="warning">登録できませんでした。通信環境を確認してもう一度試してね。</div>';
  }finally{btn.disabled=false;btn.textContent='登録する'}
}

document.getElementById('registerBtn').addEventListener('click',addPlayer);
document.getElementById('pA').addEventListener('change',renderMatch);
document.getElementById('pB').addEventListener('change',renderMatch);
document.querySelectorAll('nav button').forEach(btn=>btn.addEventListener('click',async()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(btn.dataset.screen).classList.add('active');
  await loadData(false);
}));
window.addEventListener('focus',()=>loadData(false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadData(false)});
loadData();
</script>
