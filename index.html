<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#111;color:#fff}
.app{max-width:520px;margin:auto;min-height:100vh;background:#181818}
header{padding:18px 18px 14px;text-align:center;border-bottom:1px solid #333;position:sticky;top:0;background:#181818;z-index:5}
.logo-wrap{display:flex;justify-content:center;align-items:center;margin:0 auto 8px;width:150px;height:58px;overflow:hidden}
.logo-wrap img{width:150px;height:auto;display:block} header h1{font-size:20px;margin:0 0 5px;letter-spacing:1px}.month{color:#aaa;font-size:13px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;background:#222;position:sticky;top:102px;z-index:4}
nav button{border:0;border-radius:10px;padding:10px 4px;background:#333;color:#bbb;font-weight:700;font-size:12px}
nav button.active{background:#fff;color:#111}
main{padding:16px}.screen{display:none}.screen.active{display:block}
.card{background:#242424;border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:4px 0 14px}.hint{color:#999;font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid #333}.row:last-child{border-bottom:0}
.rank{width:36px;font-weight:800}.name{flex:1;font-weight:700}.pts{font-size:18px;font-weight:800}.avgstats{font-size:11px;color:#aaa;margin-top:5px;line-height:1.5}.stats-box{margin-top:14px;padding:12px;background:#1a1a1a;border:1px solid #3a3a3a;border-radius:11px}.stats-player{font-weight:800;margin:2px 0 8px}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats-grid label{margin-top:0}
label{display:block;font-size:12px;color:#aaa;margin:12px 0 6px}
select,input{width:100%;padding:13px;border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.resultbtn{padding:14px;border:1px solid #444;background:#111;color:#fff;border-radius:10px;font-weight:700}
.resultbtn.selected{background:#fff;color:#111;border-color:#fff}
button.primary{width:100%;padding:15px;border:0;border-radius:11px;background:#fff;color:#111;font-weight:800;font-size:16px;margin-top:14px}
.warning{color:#ffb3b3;background:#321f1f;padding:10px;border-radius:9px;font-size:12px;margin-top:10px}
.success{color:#c9ffd4;background:#1d3022;padding:10px;border-radius:9px;font-size:13px;margin-top:10px}
.empty{text-align:center;color:#777;padding:30px 10px}.small{font-size:11px;color:#777;margin-top:8px}
.admin-entry{margin-top:14px;text-align:center}
.admin-link{background:none;border:0;color:#777;text-decoration:underline;font-size:12px;padding:10px}
.admin-panel{display:none}
.admin-panel.active{display:block}
.match-history{margin-top:10px}
.history-item{background:#181818;border:1px solid #3a3a3a;border-radius:11px;padding:12px;margin-top:9px}
.history-title{font-weight:800;margin-bottom:5px}
.history-detail{font-size:12px;color:#aaa;line-height:1.6}
.history-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
button.admin-edit,button.admin-delete{padding:10px;border-radius:9px;font-weight:800;font-size:13px}
button.admin-edit{background:#eee;color:#111;border:0}
button.admin-delete{background:#321f1f;color:#ffb3b3;border:1px solid #633}

</style>
</head>

<script>
const SUPABASE_URL = "https://wcmxifczhmzsqhmvcukp.supabase.co";
const SUPABASE_KEY = "sb_publishable_zIssqVYp7Wg93lGSqLFhnw_fLC_kYKZ";
const API = SUPABASE_URL + '/rest/v1';
const headers = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};
let state = {players:[], matches:[]};
let sel = {};

const monthKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const prevMonthKey=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return monthKey(d)};
const monthLabel=k=>{const [y,m]=k.split('-');return `${y}年${Number(m)}月`};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const playerById=id=>state.players.find(p=>String(p.id)===String(id));
const playerName=id=>playerById(id)?.nickname||'';

async function api(path, options={}){
  const res=await fetch(API+path,{...options,headers:{...headers,...(options.headers||{})},cache:'no-store'});
  if(!res.ok){
    let body=''; try{body=await res.text()}catch(e){}
    const err=new Error(body||('HTTP '+res.status)); err.status=res.status; throw err;
  }
  const text=await res.text();
  return text?JSON.parse(text):null;
}

async function loadData(showError=true){
  try{
    const [players,matches]=await Promise.all([
      api('/players?select=id,nickname,created_at&order=created_at.asc'),
      api('/matches?select=*&order=created_at.asc')
    ]);
    state.players=players||[]; state.matches=matches||[];
    render();
  }catch(e){
    if(showError) alert('データの読み込みに失敗しました。通信環境を確認して、もう一度開き直してね。');
    console.error(e);
  }
}

function standings(k, onlyPlayed=false){
  const ms=state.matches.filter(x=>x.month_key===k);
  const played=new Set(ms.flatMap(x=>[String(x.player_a),String(x.player_b)]));
  const map=new Map(state.players.map(p=>[String(p.id),{
    ...p,points:0,matches:0,
    stats01Total:0,stats01Count:0,
    criTotal:0,criCount:0
  }]));

  const addStats=(playerId,stats01,cri)=>{
    const p=map.get(String(playerId));
    if(!p) return;
    const s01=Number(stats01), sc=Number(cri);
    if(Number.isFinite(s01)){p.stats01Total+=s01;p.stats01Count++}
    if(Number.isFinite(sc)){p.criTotal+=sc;p.criCount++}
  };

  ms.forEach(m=>{
    const w=map.get(String(m.winner)), l=map.get(String(m.loser));
    if(w){w.points+=Number(m.winner_points);w.matches++}
    if(l){l.points+=Number(m.loser_points);l.matches++}
    addStats(m.player_a,m.player_a_01_stats,m.player_a_cri_stats);
    addStats(m.player_b,m.player_b_01_stats,m.player_b_cri_stats);
  });

  return [...map.values()]
    .map(p=>({
      ...p,
      avg01:p.stats01Count ? p.stats01Total/p.stats01Count : null,
      avgCri:p.criCount ? p.criTotal/p.criCount : null
    }))
    .filter(p=>!onlyPlayed || played.has(String(p.id)))
    .sort((a,b)=>b.points-a.points||b.matches-a.matches||a.nickname.localeCompare(b.nickname,'ja'));
}

function statText(v){
  return Number.isFinite(v) ? Number(v).toFixed(2) : '-';
}

function rankRows(arr){
  return arr.map((p,i)=>`<div class="row"><div class="rank">${i+1}</div><div class="name">${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${esc(p.nickname)}<div class="avgstats">${p.matches}戦 ／ 01平均 ${statText(p.avg01)}　Cri平均 ${statText(p.avgCri)}</div></div><div class="pts">${p.points}pt</div></div>`).join('');
}

let adminUnlocked=false;


function matchScoreText(m){
  return Number(m.winner_points)===2 ? '2-0（スト勝ち）' : '2-1';
}

function legSummary(m){
  const p701=playerName(m.leg_701_winner);
  const pc=playerName(m.cricket_winner);
  const ch=m.choice_winner ? ` / Cho: ${playerName(m.choice_winner)}` : '';
  return `701: ${p701} / Cri: ${pc}${ch}`;
}

function matchStatsSummary(m){
  const a=playerName(m.player_a), b=playerName(m.player_b);
  const a01=m.player_a_01_stats==null?'-':Number(m.player_a_01_stats).toFixed(2);
  const ac=m.player_a_cri_stats==null?'-':Number(m.player_a_cri_stats).toFixed(2);
  const b01=m.player_b_01_stats==null?'-':Number(m.player_b_01_stats).toFixed(2);
  const bc=m.player_b_cri_stats==null?'-':Number(m.player_b_cri_stats).toFixed(2);
  return `${a}：01 ${a01} / Cri ${ac}　｜　${b}：01 ${b01} / Cri ${bc}`;
}

function renderAdminMatches(){
  const box=document.getElementById('adminMatchList');
  if(!box) return;
  const ms=state.matches
    .filter(m=>m.month_key===monthKey())
    .slice()
    .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

  if(!ms.length){
    box.innerHTML='<div class="empty">今月の対戦結果はまだありません。</div>';
    return;
  }
  box.innerHTML=ms.map(m=>`
    <div class="history-item">
      <div class="history-title">${esc(playerName(m.player_a))} vs ${esc(playerName(m.player_b))}</div>
      <div class="history-detail">
        結果：${esc(playerName(m.winner))} 勝ち ${matchScoreText(m)}<br>
        ${esc(legSummary(m))}<br>
        ${esc(matchStatsSummary(m))}
      </div>
      <div class="history-actions">
        <button class="admin-edit" data-edit-id="${m.id}">修正</button>
      </div>
    </div>`).join('');

  box.querySelectorAll('[data-delete-id]').forEach(btn=>{
    btn.addEventListener('click',()=>adminDeleteMatch(btn.dataset.deleteId,false));
  });
  box.querySelectorAll('[data-edit-id]').forEach(btn=>{
    btn.addEventListener('click',()=>adminDeleteMatch(btn.dataset.editId,true));
  });
}

async function adminDeleteMatch(matchId, editAfter){
  const pin=(document.getElementById('adminPin').value||'').trim();
  const m=state.matches.find(x=>String(x.id)===String(matchId));
  if(!m) return;

  const action=editAfter?'修正':'削除';
  if(!confirm(`${playerName(m.player_a)} vs ${playerName(m.player_b)} の結果を${action}します。よろしいですか？`)) return;

  try{
    await api('/rpc/delete_match_by_pin',{
      method:'POST',
      headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({p_match_id:Number(matchId),p_pin:pin})
    });
    await loadData(false);

    if(editAfter){
      document.getElementById('pA').value=String(m.player_a);
      document.getElementById('pB').value=String(m.player_b);
      document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
      const matchTab=document.querySelector('nav button[data-screen="match"]');
      matchTab.classList.add('active');
      document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
      document.getElementById('match').classList.add('active');
      renderMatch();
      if(document.getElementById('a01Stats')){
        document.getElementById('a01Stats').value=m.player_a_01_stats??'';
        document.getElementById('aCriStats').value=m.player_a_cri_stats??'';
        document.getElementById('b01Stats').value=m.player_b_01_stats??'';
        document.getElementById('bCriStats').value=m.player_b_cri_stats??'';
      }
      window.scrollTo({top:0,behavior:'smooth'});
      alert('元の対戦結果を削除しました。正しい結果を入力し直してね。');
    }else{
      renderAdminMatches();
      alert('対戦結果を削除しました。ランキングも再計算されています。');
    }
  }catch(e){
    console.error(e);
    const msg=String(e.message||'');
    if(msg.includes('invalid admin pin')){
      alert('PINが違います。');
    }else if(msg.includes('delete_match_by_pin')){
      alert('管理者機能の初期設定がまだです。Supabaseで管理者用SQLを1回実行してね。');
    }else{
      alert('削除できませんでした。もう一度試してね。');
    }
  }
}

function render(){
  const cur=monthKey();
  document.getElementById('monthLabel').textContent=monthLabel(cur);
  const current=standings(cur,false);
  document.getElementById('rankingList').innerHTML=current.length?rankRows(current):'<div class="empty">まだ参加者がいないよ</div>';

  const prev=prevMonthKey();
  const last=standings(prev,true);
  document.getElementById('lastList').innerHTML=last.length
    ? `<div class="hint" style="margin-bottom:8px">${monthLabel(prev)} ／ 🥇1位特典：翌月1ヶ月投げ放題無料</div>`+rankRows(last)
    : '<div class="empty">先月のランキングデータはまだありません。</div>';

  const a=document.getElementById('pA'), b=document.getElementById('pB');
  const oldA=a.value, oldB=b.value;
  const opts='<option value="">選択してください</option>'+state.players.map(p=>`<option value="${p.id}">${esc(p.nickname)}</option>`).join('');
  a.innerHTML=opts;b.innerHTML=opts;
  if(state.players.some(p=>String(p.id)===oldA)) a.value=oldA;
  if(state.players.some(p=>String(p.id)===oldB)) b.value=oldB;
  renderMatch();
  if(adminUnlocked) renderAdminMatches();
}

function alreadyPlayed(a,b){
  return state.matches.some(x=>x.month_key===monthKey() && ((String(x.player_a)===String(a)&&String(x.player_b)===String(b))||(String(x.player_a)===String(b)&&String(x.player_b)===String(a))));
}

function renderMatch(){
  const area=document.getElementById('matchArea'), a=document.getElementById('pA').value, b=document.getElementById('pB').value;
  sel={};
  if(!a||!b||a===b){area.innerHTML='<div class="small">2人を選ぶと結果を入力できます。</div>';return}
  if(alreadyPlayed(a,b)){area.innerHTML='<div class="warning">この2人は今月すでに対戦済み。</div>';return}
  area.innerHTML=`
    <div class="stats-box">
      <div class="stats-player">${esc(playerName(a))} Stats</div>
      <div class="stats-grid">
        <div><label>01 Stats</label><input id="a01Stats" type="number" inputmode="decimal" step="0.01" min="0" max="180" placeholder="例：118.80"></div>
        <div><label>Cri Stats</label><input id="aCriStats" type="number" inputmode="decimal" step="0.01" min="0" max="9" placeholder="例：7.00"></div>
      </div>
    </div>
    <div class="stats-box">
      <div class="stats-player">${esc(playerName(b))} Stats</div>
      <div class="stats-grid">
        <div><label>01 Stats</label><input id="b01Stats" type="number" inputmode="decimal" step="0.01" min="0" max="180" placeholder="例：118.80"></div>
        <div><label>Cri Stats</label><input id="bCriStats" type="number" inputmode="decimal" step="0.01" min="0" max="9" placeholder="例：7.00"></div>
      </div>
    </div>
    <label>701の勝者</label><div class="grid"><button class="resultbtn" data-leg="1" data-win="${a}">${esc(playerName(a))}</button><button class="resultbtn" data-leg="1" data-win="${b}">${esc(playerName(b))}</button></div>
    <div id="cricketWrap" style="display:none"><label>Criの勝者</label><div class="grid"><button class="resultbtn" data-leg="2" data-win="${a}">${esc(playerName(a))}</button><button class="resultbtn" data-leg="2" data-win="${b}">${esc(playerName(b))}</button></div></div>
    <div id="choiceWrap" style="display:none"><label>Choの勝者</label><div class="grid"><button class="resultbtn" data-leg="3" data-win="${a}">${esc(playerName(a))}</button><button class="resultbtn" data-leg="3" data-win="${b}">${esc(playerName(b))}</button></div></div>
    <div id="confirm"></div>`;
  area.querySelectorAll('.resultbtn').forEach(btn=>btn.addEventListener('click',()=>pick(btn)));
}

function pick(btn){
  const leg=Number(btn.dataset.leg); sel[leg]=btn.dataset.win;
  document.querySelectorAll(`[data-leg="${leg}"]`).forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');
  if(leg===1) document.getElementById('cricketWrap').style.display='block';
  if(leg===2){
    if(sel[1]===sel[2]) finishPreview(2);
    else document.getElementById('choiceWrap').style.display='block';
  }
  if(leg===3) finishPreview(3);
}

function finishPreview(legs){
  const a=document.getElementById('pA').value,b=document.getElementById('pB').value;
  const winner=sel[legs],loser=winner===a?b:a,pts=legs===2?2:1;
  document.getElementById('confirm').innerHTML=`<div class="success">${legs===2?'スト勝ち（2-0）':'2-1'}：<b>${esc(playerName(winner))} +${pts}pt</b> ／ ${esc(playerName(loser))} -${pts}pt</div><button class="primary" id="saveMatchBtn">この結果を登録</button>`;
  document.getElementById('saveMatchBtn').addEventListener('click',()=>saveMatch(a,b,winner,loser,pts,legs));
}

async function saveMatch(a,b,winner,loser,pts,legs){
  const btn=document.getElementById('saveMatchBtn'); if(btn){btn.disabled=true;btn.textContent='登録中…'}
  try{
    const result701=Number(sel[1]);
    const resultCricket=Number(sel[2]);
    const resultChoice=legs===3?Number(sel[3]):null;

    const a01=Number(document.getElementById('a01Stats')?.value);
    const aCri=Number(document.getElementById('aCriStats')?.value);
    const b01=Number(document.getElementById('b01Stats')?.value);
    const bCri=Number(document.getElementById('bCriStats')?.value);

    if(![a01,aCri,b01,bCri].every(Number.isFinite)){
      alert('2人分の01 StatsとCri Statsを入力してね。');
      return;
    }
    if(a01<0||a01>180||b01<0||b01>180){
      alert('01 Statsは0〜180で入力してね。');
      return;
    }
    if(aCri<0||aCri>9||bCri<0||bCri>9){
      alert('Cri Statsは0〜9で入力してね。');
      return;
    }

    await loadData(false);
    if(alreadyPlayed(a,b)){alert('この2人は今月すでに対戦済みです。');renderMatch();return}
    const payload={
      month_key:monthKey(), player_a:Number(a), player_b:Number(b),
      leg_701_winner:result701, cricket_winner:resultCricket,
      choice_winner:resultChoice,
      winner:Number(winner), loser:Number(loser), winner_points:pts, loser_points:-pts,
      player_a_01_stats:a01, player_a_cri_stats:aCri,
      player_b_01_stats:b01, player_b_cri_stats:bCri
    };
    await api('/matches',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(payload)});
    document.getElementById('pA').value='';document.getElementById('pB').value='';
    await loadData(false);
    alert('対戦結果を登録しました！');
  }catch(e){
    console.error(e);
    if(String(e.message).includes('matches_unique_month_pair')||String(e.message).includes('duplicate key')) alert('この2人は今月すでに対戦済みです。');
    else if(String(e.message).includes('player_a_01_stats')||String(e.message).includes('player_a_cri_stats')) alert('Stats用のSupabase設定がまだです。先に追加SQLを実行してね。');
    else alert('対戦結果を登録できませんでした。もう一度試してね。');
  }finally{if(btn){btn.disabled=false;btn.textContent='この結果を登録'}}
}

async function addPlayer(){
  const nameEl=document.getElementById('newName'),msg=document.getElementById('regMsg'),btn=document.getElementById('registerBtn');
  const name=(nameEl.value||'').trim();
  if(!name){msg.innerHTML='<div class="warning">ニックネームを入力してね。</div>';return}
  btn.disabled=true;btn.textContent='登録中…';
  try{
    await loadData(false);
    if(state.players.length>=20){msg.innerHTML='<div class="warning">参加者は最大20人まで。</div>';return}
    if(state.players.some(p=>p.nickname.trim().toLowerCase()===name.toLowerCase())){msg.innerHTML='<div class="warning">同じニックネームがあるよ。</div>';return}
    await api('/players',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({nickname:name})});
    nameEl.value='';msg.innerHTML='<div class="success">登録完了！全員のランキングに反映したよ。</div>';
    await loadData(false);
  }catch(e){
    console.error(e);
    if(String(e.message).includes('duplicate key')) msg.innerHTML='<div class="warning">同じニックネームがあるよ。</div>';
    else if(String(e.message).includes('best_rating')) msg.innerHTML='<div class="warning">Supabase側の参加者設定を先に更新してね。</div>';
    else msg.innerHTML='<div class="warning">登録できませんでした。通信環境を確認してもう一度試してね。</div>';
  }finally{btn.disabled=false;btn.textContent='登録する'}
}


document.getElementById('openAdminBtn').addEventListener('click',()=>{
  const panel=document.getElementById('adminPanel');
  panel.classList.toggle('active');
  if(panel.classList.contains('active')) panel.scrollIntoView({behavior:'smooth',block:'start'});
});

document.getElementById('adminLoginBtn').addEventListener('click',()=>{
  const pin=(document.getElementById('adminPin').value||'').trim();
  const msg=document.getElementById('adminMsg');
  if(pin!=='0627'){
    msg.innerHTML='<div class="warning">PINが違います。</div>';
    return;
  }
  adminUnlocked=true;
  msg.innerHTML='';
  document.getElementById('adminLogin').style.display='none';
  document.getElementById('adminContent').style.display='block';
  renderAdminMatches();
});

document.getElementById('adminLogoutBtn').addEventListener('click',()=>{
  adminUnlocked=false;
  document.getElementById('adminPin').value='';
  document.getElementById('adminContent').style.display='none';
  document.getElementById('adminLogin').style.display='block';
  document.getElementById('adminPanel').classList.remove('active');
});

document.getElementById('registerBtn').addEventListener('click',addPlayer);
document.getElementById('pA').addEventListener('change',renderMatch);
document.getElementById('pB').addEventListener('change',renderMatch);
document.querySelectorAll('nav button').forEach(btn=>btn.addEventListener('click',async()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(btn.dataset.screen).classList.add('active');
  await loadData(false);
}));
window.addEventListener('focus',()=>loadData(false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadData(false)});
loadData();
</script>
</body>
</html>
