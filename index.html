<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CONNECT MONTHLY RANKING</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#111;color:#fff}
.app{max-width:520px;margin:auto;min-height:100vh;background:#181818}
header{padding:18px 18px 14px;text-align:center;border-bottom:1px solid #333;position:sticky;top:0;background:#181818;z-index:5}
.logo-wrap{display:flex;justify-content:center;align-items:center;margin:0 auto 8px;width:150px;height:58px;overflow:hidden}
.logo-wrap img{width:150px;height:auto;display:block} header h1{font-size:20px;margin:0 0 5px;letter-spacing:1px}.month{color:#aaa;font-size:13px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;background:#222;position:sticky;top:102px;z-index:4}
nav button{border:0;border-radius:10px;padding:10px 4px;background:#333;color:#bbb;font-weight:700;font-size:12px}
nav button.active{background:#fff;color:#111}
main{padding:16px}.screen{display:none}.screen.active{display:block}
.card{background:#242424;border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:4px 0 14px}.hint{color:#999;font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid #333}.row:last-child{border-bottom:0}
.rank{width:36px;font-weight:800}.name{flex:1;font-weight:700}.rt{color:#888;font-size:12px;margin-left:7px}.pts{font-size:18px;font-weight:800}
label{display:block;font-size:12px;color:#aaa;margin:12px 0 6px}
select,input{width:100%;padding:13px;border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.resultbtn{padding:14px;border:1px solid #444;background:#111;color:#fff;border-radius:10px;font-weight:700}
.resultbtn.selected{background:#fff;color:#111;border-color:#fff}
button.primary{width:100%;padding:15px;border:0;border-radius:11px;background:#fff;color:#111;font-weight:800;font-size:16px;margin-top:14px}
.warning{color:#ffb3b3;background:#321f1f;padding:10px;border-radius:9px;font-size:12px;margin-top:10px}
.success{color:#c9ffd4;background:#1d3022;padding:10px;border-radius:9px;font-size:13px;margin-top:10px}
.empty{text-align:center;color:#777;padding:30px 10px}.small{font-size:11px;color:#777;margin-top:8px}
</style>
</head>

<nav>
<button class="active" data-screen="ranking">現在のランキング</button>
<button data-screen="match">対戦結果入力</button>
<button data-screen="last">先月のランキング</button>
</nav>
<main>
<section id="ranking" class="screen active">
<div class="card"><h2>🏆 現在のランキング</h2><div id="rankingList"></div></div>
<div class="card"><h2>参加者登録</h2>
<div class="hint">ニックネームと過去最高レーティングを登録。レーティングは表示のみ。</div>
<label>ニックネーム</label><input id="newName" maxlength="20" placeholder="例：ともき">
<label>過去最高レーティング</label><input id="newRt" type="number" step="0.1" min="0" max="20" placeholder="例：8.2">
<button class="primary" id="registerBtn">登録する</button>
<div id="regMsg"></div></div>
</section>
<section id="match" class="screen">
<div class="card"><h2>🎯 対戦結果入力</h2>
<div class="hint">同じ組み合わせは今月1回まで。</div>
<label>プレイヤーA</label><select id="pA"></select>
<label>プレイヤーB</label><select id="pB"></select>
<div id="matchArea"></div>
</div>
</section>
<section id="last" class="screen">
<div class="card"><h2>🏆 先月のランキング</h2><div id="lastList"></div></div>
</section>
</main></div>
<script>
const KEY='connect_darts_v1';
let db;
try{db=JSON.parse(localStorage.getItem(KEY)||'{"players":[],"months":{}}')}catch(e){db={players:[],months:{}}}
const monthKey=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const prevMonth=()=>{let d=new Date();d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function ensureMonth(){let k=monthKey();if(!db.months[k])db.months[k]={points:{},matches:[]};db.players.forEach(p=>{if(db.months[k].points[p.id]==null)db.months[k].points[p.id]=0});save()}
function nameOf(id){return db.players.find(p=>p.id===id)?.name||''}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){
 ensureMonth(); const k=monthKey(),m=db.months[k];
 document.getElementById('monthLabel').textContent=k.replace('-','年')+'月';
 const arr=db.players.map(p=>({...p,points:m.points[p.id]||0,matches:m.matches.filter(x=>x.a===p.id||x.b===p.id).length}))
 .sort((a,b)=>b.points-a.points||b.matches-a.matches||a.name.localeCompare(b.name));
 document.getElementById('rankingList').innerHTML=arr.length?arr.map((p,i)=>`<div class="row"><div class="rank">${i+1}</div><div class="name">${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${esc(p.name)} <span class="rt">最高Rt.${p.rt}</span></div><div class="pts">${p.points}pt</div></div>`).join(''):'<div class="empty">まだ参加者がいないよ</div>';
 const opts='<option value="">選択してください</option>'+db.players.map(p=>`<option value="${p.id}">${esc(p.name)} (最高Rt.${p.rt})</option>`).join('');
 const a=document.getElementById('pA'),b=document.getElementById('pB'),va=a.value,vb=b.value;
 a.innerHTML=opts;b.innerHTML=opts;a.value=va;b.value=vb;renderLast();renderMatch();
}
function renderLast(){
 const k=prevMonth(),m=db.months[k];
 if(!m){document.getElementById('lastList').innerHTML='<div class="empty">先月のランキングデータはまだありません。</div>';return}
 const list=db.players.map(p=>({p,points:m.points[p.id]||0})).sort((a,b)=>b.points-a.points);
 document.getElementById('lastList').innerHTML=list.map((x,i)=>`<div class="row"><div class="rank">${i+1}</div><div class="name">${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${esc(x.p.name)}</div><div class="pts">${x.points}pt</div></div>`).join('');
}
function renderMatch(){
 const area=document.getElementById('matchArea'),a=document.getElementById('pA').value,b=document.getElementById('pB').value;
 if(!a||!b||a===b){area.innerHTML='<div class="small">2人を選ぶと結果を入力できます。</div>';return}
 const m=db.months[monthKey()];
 if(m.matches.some(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a))){area.innerHTML='<div class="warning">この2人は今月すでに対戦済み。</div>';return}
 area.innerHTML=`<label>701の勝者</label><div class="grid"><button class="resultbtn" data-leg="1" data-win="${a}">${esc(nameOf(a))}</button><button class="resultbtn" data-leg="1" data-win="${b}">${esc(nameOf(b))}</button></div><div id="cricketWrap" style="display:none"><label>クリケットの勝者</label><div class="grid"><button class="resultbtn" data-leg="2" data-win="${a}">${esc(nameOf(a))}</button><button class="resultbtn" data-leg="2" data-win="${b}">${esc(nameOf(b))}</button></div></div><div id="choiceWrap" style="display:none"><label>チョイスの勝者</label><div class="grid"><button class="resultbtn" data-leg="3" data-win="${a}">${esc(nameOf(a))}</button><button class="resultbtn" data-leg="3" data-win="${b}">${esc(nameOf(b))}</button></div></div><div id="confirm"></div>`;
 window.sel={};
 area.querySelectorAll('.resultbtn').forEach(btn=>btn.addEventListener('click',()=>pick(btn)));
}
function pick(btn){
 const leg=Number(btn.dataset.leg);window.sel[leg]=btn.dataset.win;
 document.querySelectorAll(`[data-leg="${leg}"]`).forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');
 if(leg===1)document.getElementById('cricketWrap').style.display='block';
 if(leg===2){if(window.sel[1]===window.sel[2])finishPreview(2);else document.getElementById('choiceWrap').style.display='block'}
 if(leg===3)finishPreview(3);
}
function finishPreview(legs){
 const a=document.getElementById('pA').value,b=document.getElementById('pB').value;
 const winner=window.sel[legs],loser=winner===a?b:a,pts=legs===2?2:1;
 const c=document.getElementById('confirm');
 c.innerHTML=`<div class="success">${legs===2?'スト勝ち':'2-1'}：<b>${esc(nameOf(winner))} +${pts}pt</b> ／ ${esc(nameOf(loser))} -${pts}pt</div><button class="primary" id="saveMatchBtn">この結果を登録</button>`;
 document.getElementById('saveMatchBtn').addEventListener('click',()=>saveMatch(a,b,winner,pts));
}
function saveMatch(a,b,winner,pts){
 const m=db.months[monthKey()];if(m.matches.some(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a)))return;
 const loser=winner===a?b:a;m.points[winner]=(m.points[winner]||0)+pts;m.points[loser]=(m.points[loser]||0)-pts;
 m.matches.push({a,b,winner,at:new Date().toISOString()});save();alert('対戦結果を登録しました！');document.getElementById('pA').value='';document.getElementById('pB').value='';render();
}
function addPlayer(){
 const name=(document.getElementById('newName').value||'').trim(),rt=(document.getElementById('newRt').value||'').trim(),msg=document.getElementById('regMsg');
 if(!name||!rt){msg.innerHTML='<div class="warning">ニックネームと過去最高レーティングを入力してね。</div>';return}
 const rtNum=Number(rt);
 if(!Number.isFinite(rtNum)||rtNum<0||rtNum>20){msg.innerHTML='<div class="warning">レーティングは0〜20の数字で入力してね。</div>';return}
 if(db.players.length>=20){msg.innerHTML='<div class="warning">参加者は最大20人まで。</div>';return}
 if(db.players.some(p=>p.name.trim().toLowerCase()===name.toLowerCase())){msg.innerHTML='<div class="warning">同じニックネームがあるよ。</div>';return}
 db.players.push({id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,10),name,rt:rtNum.toFixed(1).replace(/\.0$/,'')});
 ensureMonth();save();document.getElementById('newName').value='';document.getElementById('newRt').value='';msg.innerHTML='<div class="success">登録完了！ランキングに追加したよ。</div>';render();
}
document.getElementById('registerBtn').addEventListener('click',addPlayer);
document.getElementById('pA').addEventListener('change',renderMatch);
document.getElementById('pB').addEventListener('change',renderMatch);
document.querySelectorAll('nav button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(btn.dataset.screen).classList.add('active');render()}));
render();
</script>
</body>
</html>
