<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#111;color:#fff}
.app{max-width:520px;margin:auto;min-height:100vh;background:#181818}
header{padding:18px 18px 14px;text-align:center;border-bottom:1px solid #333;position:sticky;top:0;background:#181818;z-index:5}
.logo-wrap{display:flex;justify-content:center;align-items:center;margin:0 auto 8px;width:150px;height:58px;overflow:hidden}

.card{background:#242424;border-radius:14px;padding:16px;margin-bottom:12px}

.row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid #333}.row:last-child{border-bottom:0}
.rank{width:36px;font-weight:800}.name{flex:1;font-weight:700}.pts{font-size:18px;font-weight:800}.avgstats{font-size:11px;color:#aaa;margin-top:5px;line-height:1.5}.stats-box{margin-top:14px;padding:12px;background:#1a1a1a;border:1px solid #3a3a3a;border-radius:11px}.stats-player{font-weight:800;margin:2px 0 8px}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats-grid label{margin-top:0}.leg-title{font-size:14px;font-weight:800;margin:16px 0 8px}.choice-type{margin:10px 0}
label{display:block;font-size:12px;color:#aaa;margin:12px 0 6px}
select,input{width:100%;padding:13px;border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.resultbtn{padding:14px;border:1px solid #444;background:#111;color:#fff;border-radius:10px;font-weight:700}
.resultbtn.selected{background:#fff;color:#111;border-color:#fff}
button.primary{width:100%;padding:15px;border:0;border-radius:11px;background:#fff;color:#111;font-weight:800;font-size:16px;margin-top:14px}
.warning{color:#ffb3b3;background:#321f1f;padding:10px;border-radius:9px;font-size:12px;margin-top:10px}
.success{color:#c9ffd4;background:#1d3022;padding:10px;border-radius:9px;font-size:13px;margin-top:10px}
.empty{text-align:center;color:#777;padding:30px 10px}.small{font-size:11px;color:#777;margin-top:8px}
.admin-entry{margin-top:14px;text-align:center}
.admin-link{background:none;border:0;color:#777;text-decoration:underline;font-size:12px;padding:10px}
.admin-panel{display:none}
.admin-panel.active{display:block}
.match-history{margin-top:10px}
.history-item{background:#181818;border:1px solid #3a3a3a;border-radius:11px;padding:12px;margin-top:9px}
.history-title{font-weight:800;margin-bottom:5px}
.history-detail{font-size:12px;color:#aaa;line-height:1.6}
.history-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
button.admin-edit,button.admin-delete{padding:10px;border-radius:9px;font-weight:800;font-size:13px}
button.admin-edit{background:#eee;color:#111;border:0}
button.admin-delete{background:#321f1f;color:#ffb3b3;border:1px solid #633}

</style>

<script>
const SUPABASE_URL = "https://wcmxifczhmzsqhmvcukp.supabase.co";
const SUPABASE_KEY = "sb_publishable_zIssqVYp7Wg93lGSqLFhnw_fLC_kYKZ";
const API = SUPABASE_URL + '/rest/v1';
const headers = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};
let state = {players:[], matches:[]};
let sel = {};

const monthKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const prevMonthKey=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return monthKey(d)};
const monthLabel=k=>{const [y,m]=k.split('-');return `${y}年${Number(m)}月`};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const playerById=id=>state.players.find(p=>String(p.id)===String(id));
const playerName=id=>playerById(id)?.nickname||'';

async function api(path, options={}){
  const res=await fetch(API+path,{...options,headers:{...headers,...(options.headers||{})},cache:'no-store'});
  if(!res.ok){
    let body=''; try{body=await res.text()}catch(e){}
    const err=new Error(body||('HTTP '+res.status)); err.status=res.status; throw err;
  }
  const text=await res.text();
  return text?JSON.parse(text):null;
}

async function loadData(showError=true){
  try{
    const [players,matches]=await Promise.all([
      api('/players?select=id,nickname,created_at&order=created_at.asc'),
      api('/matches?select=*&order=created_at.asc')
    ]);
    state.players=players||[]; state.matches=matches||[];
    render();
  }catch(e){
    if(showError) alert('データの読み込みに失敗しました。通信環境を確認して、もう一度開き直してね。');
    console.error(e);
  }
}

function standings(k, onlyPlayed=false){
  const ms=state.matches.filter(x=>x.month_key===k);
  const played=new Set(ms.flatMap(x=>[String(x.player_a),String(x.player_b)]));
  const map=new Map(state.players.map(p=>[String(p.id),{
    ...p,points:0,matches:0,
    stats01Total:0,stats01Count:0,
    criTotal:0,criCount:0
  }]));

  const add01=(playerId,val)=>{
    const p=map.get(String(playerId)), n=Number(val);
    if(p && Number.isFinite(n)){p.stats01Total+=n;p.stats01Count++}
  };
  const addCri=(playerId,val)=>{
    const p=map.get(String(playerId)), n=Number(val);
    if(p && Number.isFinite(n)){p.criTotal+=n;p.criCount++}
  };

  ms.forEach(m=>{
    const w=map.get(String(m.winner)), l=map.get(String(m.loser));
    if(w){w.points+=Number(m.winner_points);w.matches++}
    if(l){l.points+=Number(m.loser_points);l.matches++}

    // 701 は 01 Stats
    add01(m.player_a,m.player_a_01_stats);
    add01(m.player_b,m.player_b_01_stats);

    // Cri
    addCri(m.player_a,m.player_a_cri_stats);
    addCri(m.player_b,m.player_b_cri_stats);

    // Cho は 01 / Cri のどちらか
    if(m.choice_type==='01'){
      add01(m.player_a,m.player_a_choice_stats);
      add01(m.player_b,m.player_b_choice_stats);
    }else if(m.choice_type==='Cri'){
      addCri(m.player_a,m.player_a_choice_stats);
      addCri(m.player_b,m.player_b_choice_stats);
    }
  });

  return [...map.values()]
    .map(p=>({
      ...p,
      avg01:p.stats01Count ? p.stats01Total/p.stats01Count : null,
      avgCri:p.criCount ? p.criTotal/p.criCount : null
    }))
    .filter(p=>!onlyPlayed || played.has(String(p.id)))
    .sort((a,b)=>b.points-a.points||b.matches-a.matches||a.nickname.localeCompare(b.nickname,'ja'));
}

function statText(v){
  return Number.isFinite(v) ? Number(v).toFixed(2) : '-';
}

function rankRows(arr){
  return arr.map((p,i)=>`<div class="row"><div class="rank">${i+1}</div><div class="name">${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${esc(p.nickname)}<div class="avgstats">${p.matches}戦 ／ 01平均 ${statText(p.avg01)}　Cri平均 ${statText(p.avgCri)}</div></div><div class="pts">${p.points}pt</div></div>`).join('');
}

let adminUnlocked=false;


function matchScoreText(m){
  return Number(m.winner_points)===2 ? '2-0（スト勝ち）' : '2-1';
}

function legSummary(m){
  const p701=playerName(m.leg_701_winner);
  const pc=playerName(m.cricket_winner);
  const ch=m.choice_winner ? ` / Cho: ${playerName(m.choice_winner)}` : '';
  return `701: ${p701} / Cri: ${pc}${ch}`;
}

function matchStatsSummary(m){
  const a=playerName(m.player_a), b=playerName(m.player_b);
  const f=v=>v==null?'-':Number(v).toFixed(2);
  let text=`${a}：01 ${f(m.player_a_01_stats)} / Cri ${f(m.player_a_cri_stats)}　｜　${b}：01 ${f(m.player_b_01_stats)} / Cri ${f(m.player_b_cri_stats)}`;
  if(m.choice_winner){
    text+=`　｜　Cho(${m.choice_type||'-'}) ${a} ${f(m.player_a_choice_stats)} / ${b} ${f(m.player_b_choice_stats)}`;
  }
  return text;
}

function renderAdminMatches(){
  const box=document.getElementById('adminMatchList');
  if(!box) return;
  const ms=state.matches
    .filter(m=>m.month_key===monthKey())
    .slice()
    .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

  if(!ms.length){
    box.innerHTML='<div class="empty">今月の対戦結果はまだありません。</div>';
    return;
  }
  box.innerHTML=ms.map(m=>`
    <div class="history-item">
      <div class="history-title">${esc(playerName(m.player_a))} vs ${esc(playerName(m.player_b))}</div>
      <div class="history-detail">
        結果：${esc(playerName(m.winner))} 勝ち ${matchScoreText(m)}<br>
        ${esc(legSummary(m))}<br>
        ${esc(matchStatsSummary(m))}
      </div>
      <div class="history-actions">
        <button class="admin-edit" data-edit-id="${m.id}">修正</button>
      </div>
    </div>`).join('');

  box.querySelectorAll('[data-delete-id]').forEach(btn=>{
    btn.addEventListener('click',()=>adminDeleteMatch(btn.dataset.deleteId,false));
  });
  box.querySelectorAll('[data-edit-id]').forEach(btn=>{
    btn.addEventListener('click',()=>adminDeleteMatch(btn.dataset.editId,true));
  });
}

async function adminDeleteMatch(matchId, editAfter){
  const pin=(document.getElementById('adminPin').value||'').trim();
  const m=state.matches.find(x=>String(x.id)===String(matchId));
  if(!m) return;

  const action=editAfter?'修正':'削除';
  if(!confirm(`${playerName(m.player_a)} vs ${playerName(m.player_b)} の結果を${action}します。よろしいですか？`)) return;

  try{
    await api('/rpc/delete_match_by_pin',{
      method:'POST',
      headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({p_match_id:Number(matchId),p_pin:pin})
    });
    await loadData(false);

    if(editAfter){
      document.getElementById('pA').value=String(m.player_a);
      document.getElementById('pB').value=String(m.player_b);
      document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
      const matchTab=document.querySelector('nav button[data-screen="match"]');
      matchTab.classList.add('active');
      document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
      document.getElementById('match').classList.add('active');
      renderMatch();
      if(document.getElementById('a01Stats')){
        document.getElementById('a01Stats').value=m.player_a_01_stats??'';
        document.getElementById('aCriStats').value=m.player_a_cri_stats??'';
        document.getElementById('b01Stats').value=m.player_b_01_stats??'';
        document.getElementById('bCriStats').value=m.player_b_cri_stats??'';
        if(m.choice_winner && document.getElementById('choiceType')){
          document.getElementById('choiceType').value=m.choice_type??'';
          renderChoiceStatsInputs();
          if(document.getElementById('aChoiceStats')) document.getElementById('aChoiceStats').value=m.player_a_choice_stats??'';
          if(document.getElementById('bChoiceStats')) document.getElementById('bChoiceStats').value=m.player_b_choice_stats??'';
        }
      }
      window.scrollTo({top:0,behavior:'smooth'});
      alert('元の対戦結果を削除しました。正しい結果を入力し直してね。');
    }else{
      renderAdminMatches();
      alert('対戦結果を削除しました。ランキングも再計算されています。');
    }
  }catch(e){
    console.error(e);
    const msg=String(e.message||'');
    if(msg.includes('invalid admin pin')){
      alert('PINが違います。');
    }else if(msg.includes('delete_match_by_pin')){
      alert('管理者機能の初期設定がまだです。Supabaseで管理者用SQLを1回実行してね。');
    }else{
      alert('削除できませんでした。もう一度試してね。');
    }
  }
}

function render(){
  const cur=monthKey();
  document.getElementById('monthLabel').textContent=monthLabel(cur);
  const current=standings(cur,false);
  document.getElementById('rankingList').innerHTML=current.length?rankRows(current):'<div class="empty">まだ参加者がいないよ</div>';

  const prev=prevMonthKey();
  const last=standings(prev,true);
  document.getElementById('lastList').innerHTML=last.length
    ? `<div class="hint" style="margin-bottom:8px">${monthLabel(prev)} ／ 🥇1位特典：翌月1ヶ月投げ放題無料</div>`+rankRows(last)
    : '<div class="empty">先月のランキングデータはまだありません。</div>';

  const a=document.getElementById('pA'), b=document.getElementById('pB');
  const oldA=a.value, oldB=b.value;
  const opts='<option value="">選択してください</option>'+state.players.map(p=>`<option value="${p.id}">${esc(p.nickname)}</option>`).join('');
  a.innerHTML=opts;b.innerHTML=opts;
  const up=document.getElementById('unplayedPlayer');
  if(up){const oldU=up.value;up.innerHTML=opts;if(state.players.some(p=>String(p.id)===oldU))up.value=oldU;renderUnplayed();}
  if(state.players.some(p=>String(p.id)===oldA)) a.value=oldA;
  if(state.players.some(p=>String(p.id)===oldB)) b.value=oldB;
  renderMatch();
  if(adminUnlocked) renderAdminMatches();
}

function renderUnplayed(){
 const pick=document.getElementById('unplayedPlayer'),list=document.getElementById('unplayedList'); if(!pick||!list)return; const me=pick.value;
 if(!me){list.innerHTML='<div class="small">ニックネームを選ぶと、今月の未対戦相手が出るよ。</div>';return}
 const remaining=state.players.filter(p=>String(p.id)!==String(me)&&!alreadyPlayed(me,p.id));
 if(!remaining.length){list.innerHTML='<div class="success">🎉 今月は全員と対戦済み！</div>';return}
 list.innerHTML='<div class="small" style="margin-bottom:8px">未対戦 '+remaining.length+'人 ／ 相手をタップすると対戦入力にセット</div><div class="grid">'+remaining.map(p=>`<button type="button" class="resultbtn unplayed-opponent" data-id="${p.id}">${esc(p.nickname)}</button>`).join('')+'</div>';
 list.querySelectorAll('.unplayed-opponent').forEach(btn=>btn.addEventListener('click',()=>{document.getElementById('pA').value=String(me);document.getElementById('pB').value=String(btn.dataset.id);renderMatch();document.getElementById('unplayedPanel').style.display='none';document.getElementById('unplayedToggle').textContent='未対戦相手を探す';document.getElementById('matchArea').scrollIntoView({behavior:'smooth',block:'start'});}));
}

function alreadyPlayed(a,b){
  return state.matches.some(x=>x.month_key===monthKey() && ((String(x.player_a)===String(a)&&String(x.player_b)===String(b))||(String(x.player_a)===String(b)&&String(x.player_b)===String(a))));
}


function renderMatch(){
  const area=document.getElementById('matchArea');
  const a=document.getElementById('pA').value;
  const b=document.getElementById('pB').value;
  sel={};

  if(!a||!b||a===b){
    area.innerHTML='<div class="small">2人を選ぶと結果を入力できます。</div>';
    return;
  }
  if(alreadyPlayed(a,b)){
    area.innerHTML='<div class="warning">この2人は今月すでに対戦済み。</div>';
    return;
  }

  area.innerHTML=`
    <div id="leg1Block">
      <div class="leg-title">① 701（01）</div>
      <div class="grid">
        <button class="resultbtn" data-leg="1" data-win="${a}">${esc(playerName(a))}</button>
        <button class="resultbtn" data-leg="1" data-win="${b}">${esc(playerName(b))}</button>
      </div>
      <div class="stats-box">
        <div class="stats-grid">
          <div><label>${esc(playerName(a))} 01 Stats</label><input id="a01Stats" type="number" inputmode="decimal" step="0.01" min="0" max="180" placeholder="例：118.80"></div>
          <div><label>${esc(playerName(b))} 01 Stats</label><input id="b01Stats" type="number" inputmode="decimal" step="0.01" min="0" max="180" placeholder="例：105.50"></div>
        </div>
      </div>
      <button class="primary" id="confirmLeg1Btn">701を確定</button>
      <div id="leg1Msg"></div>
    </div>

    <div id="leg2Block" style="display:none">
      <div class="leg-title">② Cri</div>
      <div class="grid">
        <button class="resultbtn" data-leg="2" data-win="${a}">${esc(playerName(a))}</button>
        <button class="resultbtn" data-leg="2" data-win="${b}">${esc(playerName(b))}</button>
      </div>
      <div class="stats-box">
        <div class="stats-grid">
          <div><label>${esc(playerName(a))} Cri Stats</label><input id="aCriStats" type="number" inputmode="decimal" step="0.01" min="0" max="9" placeholder="例：7.00"></div>
          <div><label>${esc(playerName(b))} Cri Stats</label><input id="bCriStats" type="number" inputmode="decimal" step="0.01" min="0" max="9" placeholder="例：5.80"></div>
        </div>
      </div>
      <button class="primary" id="confirmLeg2Btn">Criを確定</button>
      <div id="leg2Msg"></div>
    </div>

    <div id="choiceWrap" style="display:none">
      <div class="leg-title">③ Cho</div>
      <label>Choのゲーム</label>
      <select id="choiceType" class="choice-type">
        <option value="">01 / Cri を選択</option>
        <option value="01">01</option>
        <option value="Cri">Cri</option>
      </select>
      <div class="grid">
        <button class="resultbtn" data-leg="3" data-win="${a}">${esc(playerName(a))}</button>
        <button class="resultbtn" data-leg="3" data-win="${b}">${esc(playerName(b))}</button>
      </div>
      <div class="stats-box" id="choiceStatsBox">
        <div class="small">Choのゲームを選ぶとStats入力欄が表示されます。</div>
      </div>
      <button class="primary" id="confirmLeg3Btn">Choを確定</button>
      <div id="leg3Msg"></div>
    </div>

    <div id="matchConfirm"></div>`;

  area.querySelectorAll('.resultbtn').forEach(btn=>btn.addEventListener('click',()=>pick(btn)));
  document.getElementById('confirmLeg1Btn').addEventListener('click',confirmLeg1);
  document.getElementById('confirmLeg2Btn').addEventListener('click',confirmLeg2);
  document.getElementById('confirmLeg3Btn').addEventListener('click',confirmLeg3);
  document.getElementById('choiceType').addEventListener('change',renderChoiceStatsInputs);
}

function renderChoiceStatsInputs(){
  const type=document.getElementById('choiceType')?.value;
  const box=document.getElementById('choiceStatsBox');
  const a=document.getElementById('pA').value;
  const b=document.getElementById('pB').value;
  if(!box) return;
  if(!type){
    box.innerHTML='<div class="small">Choのゲームを選ぶとStats入力欄が表示されます。</div>';
    return;
  }
  const max=type==='01'?180:9;
  const ex=type==='01'?'118.80':'7.00';
  box.innerHTML=`
    <div class="stats-grid">
      <div><label>${esc(playerName(a))} ${type} Stats</label><input id="aChoiceStats" type="number" inputmode="decimal" step="0.01" min="0" max="${max}" placeholder="例：${ex}"></div>
      <div><label>${esc(playerName(b))} ${type} Stats</label><input id="bChoiceStats" type="number" inputmode="decimal" step="0.01" min="0" max="${max}" placeholder="例：${ex}"></div>
    </div>`;
}

function pick(btn){
  const leg=Number(btn.dataset.leg);
  sel[leg]=btn.dataset.win;
  document.querySelectorAll(`[data-leg="${leg}"]`).forEach(x=>x.classList.remove('selected'));
  btn.classList.add('selected');
}

function lockLeg(leg,locked){
  document.querySelectorAll(`[data-leg="${leg}"]`).forEach(x=>x.disabled=locked);
  const ids=leg===1?['a01Stats','b01Stats']:leg===2?['aCriStats','bCriStats']:['choiceType','aChoiceStats','bChoiceStats'];
  ids.forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=locked});
}

function confirmLeg1(){
  const msg=document.getElementById('leg1Msg');
  const a01=Number(document.getElementById('a01Stats')?.value);
  const b01=Number(document.getElementById('b01Stats')?.value);
  if(!sel[1]){msg.innerHTML='<div class="warning">701の勝者を選んでね。</div>';return}
  if(![a01,b01].every(Number.isFinite)){msg.innerHTML='<div class="warning">2人分の01 Statsを入力してね。</div>';return}
  if(a01<0||a01>180||b01<0||b01>180){msg.innerHTML='<div class="warning">01 Statsは0〜180で入力してね。</div>';return}

  sel.leg1Confirmed=true; sel.a01=a01; sel.b01=b01;
  lockLeg(1,true);
  document.getElementById('confirmLeg1Btn').style.display='none';
  msg.innerHTML='<div class="success">701を確定しました。<button type="button" id="editLeg1Btn" class="admin-link">修正する</button></div>';
  document.getElementById('editLeg1Btn').addEventListener('click',()=>{
    sel.leg1Confirmed=false;
    lockLeg(1,false);
    document.getElementById('confirmLeg1Btn').style.display='block';
    msg.innerHTML='';
    resetAfterLeg1();
  });
  document.getElementById('leg2Block').style.display='block';
  document.getElementById('leg2Block').scrollIntoView({behavior:'smooth',block:'start'});
}

function resetAfterLeg1(){
  sel[2]=undefined; sel.leg2Confirmed=false;
  sel[3]=undefined; sel.leg3Confirmed=false;
  document.querySelectorAll('[data-leg="2"],[data-leg="3"]').forEach(x=>{x.classList.remove('selected');x.disabled=false});
  ['aCriStats','bCriStats'].forEach(id=>{const el=document.getElementById(id);if(el){el.value='';el.disabled=false}});
  const b2=document.getElementById('confirmLeg2Btn'); if(b2)b2.style.display='block';
  const m2=document.getElementById('leg2Msg'); if(m2)m2.innerHTML='';
  const cho=document.getElementById('choiceWrap'); if(cho)cho.style.display='none';
  const ct=document.getElementById('choiceType'); if(ct){ct.value='';ct.disabled=false}
  const cs=document.getElementById('choiceStatsBox'); if(cs)cs.innerHTML='<div class="small">Choのゲームを選ぶとStats入力欄が表示されます。</div>';
  const b3=document.getElementById('confirmLeg3Btn'); if(b3)b3.style.display='block';
  const m3=document.getElementById('leg3Msg'); if(m3)m3.innerHTML='';
  const mc=document.getElementById('matchConfirm'); if(mc)mc.innerHTML='';
}

function confirmLeg2(){
  const msg=document.getElementById('leg2Msg');
  const aCri=Number(document.getElementById('aCriStats')?.value);
  const bCri=Number(document.getElementById('bCriStats')?.value);
  if(!sel.leg1Confirmed){msg.innerHTML='<div class="warning">先に701を確定してね。</div>';return}
  if(!sel[2]){msg.innerHTML='<div class="warning">Criの勝者を選んでね。</div>';return}
  if(![aCri,bCri].every(Number.isFinite)){msg.innerHTML='<div class="warning">2人分のCri Statsを入力してね。</div>';return}
  if(aCri<0||aCri>9||bCri<0||bCri>9){msg.innerHTML='<div class="warning">Cri Statsは0〜9で入力してね。</div>';return}

  sel.leg2Confirmed=true; sel.aCri=aCri; sel.bCri=bCri;
  lockLeg(2,true);
  document.getElementById('confirmLeg2Btn').style.display='none';
  msg.innerHTML='<div class="success">Criを確定しました。<button type="button" id="editLeg2Btn" class="admin-link">修正する</button></div>';
  document.getElementById('editLeg2Btn').addEventListener('click',()=>{
    sel.leg2Confirmed=false;
    lockLeg(2,false);
    document.getElementById('confirmLeg2Btn').style.display='block';
    msg.innerHTML='';
    document.getElementById('choiceWrap').style.display='none';
    document.getElementById('matchConfirm').innerHTML='';
  });

  if(String(sel[1])===String(sel[2])){
    document.getElementById('choiceWrap').style.display='none';
    showFinalConfirm(2);
  }else{
    document.getElementById('choiceWrap').style.display='block';
    document.getElementById('choiceWrap').scrollIntoView({behavior:'smooth',block:'start'});
  }
}

function confirmLeg3(){
  const msg=document.getElementById('leg3Msg');
  const type=document.getElementById('choiceType')?.value||'';
  if(!sel.leg2Confirmed){msg.innerHTML='<div class="warning">先にCriを確定してね。</div>';return}
  if(!type){msg.innerHTML='<div class="warning">Choが01かCriか選んでね。</div>';return}
  if(!sel[3]){msg.innerHTML='<div class="warning">Choの勝者を選んでね。</div>';return}
  const aChoice=Number(document.getElementById('aChoiceStats')?.value);
  const bChoice=Number(document.getElementById('bChoiceStats')?.value);
  if(![aChoice,bChoice].every(Number.isFinite)){msg.innerHTML='<div class="warning">2人分のCho Statsを入力してね。</div>';return}
  const max=type==='01'?180:9;
  if(aChoice<0||aChoice>max||bChoice<0||bChoice>max){msg.innerHTML=`<div class="warning">${type} Statsの範囲を確認してね。</div>`;return}

  sel.leg3Confirmed=true; sel.choiceType=type; sel.aChoice=aChoice; sel.bChoice=bChoice;
  lockLeg(3,true);
  document.getElementById('confirmLeg3Btn').style.display='none';
  msg.innerHTML='<div class="success">Choを確定しました。<button type="button" id="editLeg3Btn" class="admin-link">修正する</button></div>';
  document.getElementById('editLeg3Btn').addEventListener('click',()=>{
    sel.leg3Confirmed=false;
    lockLeg(3,false);
    document.getElementById('confirmLeg3Btn').style.display='block';
    msg.innerHTML='';
    document.getElementById('matchConfirm').innerHTML='';
  });
  showFinalConfirm(3);
}

function showFinalConfirm(legs){
  const a=document.getElementById('pA').value;
  const b=document.getElementById('pB').value;
  const winner=legs===2?sel[2]:sel[3];
  const loser=String(winner)===String(a)?b:a;
  const pts=legs===2?2:1;
  document.getElementById('matchConfirm').innerHTML=
    `<div class="success">${legs===2?'スト勝ち（2-0）':'2-1'}：<b>${esc(playerName(winner))} +${pts}pt</b> ／ ${esc(playerName(loser))} -${pts}pt</div><button class="primary" id="saveMatchBtn">この結果を登録</button>`;
  document.getElementById('saveMatchBtn').addEventListener('click',()=>saveMatch(a,b,winner,loser,pts,legs));
}

async function saveMatch(a,b,winner,loser,pts,legs){
  const btn=document.getElementById('saveMatchBtn');
  if(btn){btn.disabled=true;btn.textContent='登録中…'}
  try{
    const payload={
      month_key:monthKey(),
      player_a:Number(a), player_b:Number(b),
      leg_701_winner:Number(sel[1]),
      cricket_winner:Number(sel[2]),
      choice_winner:legs===3?Number(sel[3]):null,
      winner:Number(winner), loser:Number(loser),
      winner_points:pts, loser_points:-pts,
      player_a_01_stats:sel.a01, player_b_01_stats:sel.b01,
      player_a_cri_stats:sel.aCri, player_b_cri_stats:sel.bCri,
      choice_type:legs===3?sel.choiceType:null,
      player_a_choice_stats:legs===3?sel.aChoice:null,
      player_b_choice_stats:legs===3?sel.bChoice:null
    };

    await loadData(false);
    if(alreadyPlayed(a,b)){alert('この2人は今月すでに対戦済みです。');renderMatch();return}
    await api('/matches',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(payload)});
    document.getElementById('pA').value='';
    document.getElementById('pB').value='';
    await loadData(false);
    alert('対戦結果を登録しました！');
  }catch(e){
    console.error(e);
    if(String(e.message).includes('matches_unique_month_pair')||String(e.message).includes('duplicate key')) alert('この2人は今月すでに対戦済みです。');
    else alert('対戦結果を登録できませんでした。もう一度試してね。');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='この結果を登録'}
  }
}


async function addPlayer(){
  const nameEl=document.getElementById('newName'),msg=document.getElementById('regMsg'),btn=document.getElementById('registerBtn');
  const name=(nameEl.value||'').trim();
  if(!name){msg.innerHTML='<div class="warning">ニックネームを入力してね。</div>';return}
  btn.disabled=true;btn.textContent='登録中…';
  try{
    await loadData(false);
    if(state.players.length>=20){msg.innerHTML='<div class="warning">参加者は最大20人まで。</div>';return}
    if(state.players.some(p=>p.nickname.trim().toLowerCase()===name.toLowerCase())){msg.innerHTML='<div class="warning">同じニックネームがあるよ。</div>';return}
    await api('/players',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({nickname:name})});
    nameEl.value='';msg.innerHTML='<div class="success">登録完了！全員のランキングに反映したよ。</div>';
    await loadData(false);
  }catch(e){
    console.error(e);
    if(String(e.message).includes('duplicate key')) msg.innerHTML='<div class="warning">同じニックネームがあるよ。</div>';
    else if(String(e.message).includes('best_rating')) msg.innerHTML='<div class="warning">Supabase側の参加者設定を先に更新してね。</div>';
    else msg.innerHTML='<div class="warning">登録できませんでした。通信環境を確認してもう一度試してね。</div>';
  }finally{btn.disabled=false;btn.textContent='登録する'}
}


document.getElementById('openAdminBtn').addEventListener('click',()=>{
  const panel=document.getElementById('adminPanel');
  panel.classList.toggle('active');
  if(panel.classList.contains('active')) panel.scrollIntoView({behavior:'smooth',block:'start'});
});

    msg.innerHTML='<div class="warning">PINが違います。</div>';

  }

document.getElementById('adminLogoutBtn').addEventListener('click',()=>{
  adminUnlocked=false;
  document.getElementById('adminPin').value='';
  document.getElementById('adminContent').style.display='none';
  document.getElementById('adminLogin').style.display='block';
  document.getElementById('adminPanel').classList.remove('active');
});

document.getElementById('registerBtn').addEventListener('click',addPlayer);
document.getElementById('unplayedToggle').addEventListener('click',()=>{const panel=document.getElementById('unplayedPanel');const open=panel.style.display==='none';panel.style.display=open?'block':'none';document.getElementById('unplayedToggle').textContent=open?'未対戦チェックを閉じる':'未対戦相手を探す';if(open)renderUnplayed();});
document.getElementById('unplayedPlayer').addEventListener('change',renderUnplayed);
document.getElementById('pA').addEventListener('change',renderMatch);
document.getElementById('pB').addEventListener('change',renderMatch);
document.querySelectorAll('nav button').forEach(btn=>btn.addEventListener('click',async()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(btn.dataset.screen).classList.add('active');
  await loadData(false);
}));
window.addEventListener('focus',()=>loadData(false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadData(false)});
loadData();
</script>
